name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  crypto-and-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Linux source-build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++ libssl-dev
      - run: npm run setup:toolchain
      - run: npm run generate
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:consumer
